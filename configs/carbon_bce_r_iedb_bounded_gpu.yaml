train_fasta_path: data/external/iedb_reduced_subset_bounded/IEDB_reduced_subset_bounded_train.fasta
test_fasta_path: data/external/iedb_reduced_subset_bounded/IEDB_reduced_subset_bounded_test.fasta
output_dir: outputs/carbon_bce_r_iedb_bounded_gpu
model_name: CARBON-BCE-R region-aware IEDB bounded
dataset_name: IEDB reduced subset bounded test (47 antigens, max length 600)

seed: 42
validation_fraction: 0.2
epochs: 12
batch_size: 4
learning_rate: 0.0003
weight_decay: 0.0001

hidden_dim: 192
cnn_dilation_rates:
  - 1
  - 2
  - 4
transformer_layers: 2
attention_heads: 4
dropout: 0.15

focal_alpha: 0.70
focal_gamma: 2.0
smoothness_weight: 0.02
tversky_weight: 0.05
tversky_alpha: 0.70
tversky_beta: 0.30
prior_bias_init: true
decision_threshold_grid:
  start: 0.05
  stop: 0.95
  count: 91
